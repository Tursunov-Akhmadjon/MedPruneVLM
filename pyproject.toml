[project]
name = "medprunevlm"
version = "0.1.0"
description = "CAFP + HAFCT: anatomy-prior visual token pruning and hallucination-aware fine-tuning for medical vision-language models"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "accelerate>=0.29.0",
    "bert-score>=0.3.13",
    "bitsandbytes>=0.43.1",
    "datasets>=2.19.0",
    "nltk>=3.8.0",
    "numpy<2.0",
    "opencv-python>=4.8.0",
    "peft>=0.10.0",
    "pillow>=10.0.0",
    "radgraph>=0.1.18",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.4.0",
    "torch==2.4.1",
    "tqdm>=4.65.0",
    "transformers>=4.39.0,<5.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
